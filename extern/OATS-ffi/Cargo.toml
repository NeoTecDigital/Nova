[package]
name = "oats-ffi"
version = "0.1.0"
edition = "2021"
description = "C-FFI and ECS Delta synchronization runtime for OATS-rs with Scheduler, Coordinator, Dispatcher, and Organizer"
license = "MIT"
authors = ["Richard Christopher <dev@ancillary.enterprises>"]

[lib]
name = "oats_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
oats-framework = { path = "../OATS-rs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
libc = "0.2"
parking_lot = "0.12"
tracing = "0.1"
